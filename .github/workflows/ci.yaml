name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Ya no requiere permisos de escritura (contents: write)

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas
        id: run_tests
        continue-on-error: true 
        run: |
          pytest
          # O el comando que use tu repositorio para correr las pruebas

      - name: Actualizar README.md
        run: |
          python update_readme.py --status ${{ steps.run_tests.outcome }}

      - name: Subir README como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: readme-actualizado
          path: README.md
          retention-days: 5
